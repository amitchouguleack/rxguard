name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      python: ${{ steps.filter.outputs.python }}
      cpp: ${{ steps.filter.outputs.cpp }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'contracts/**'
              - 'terminology/**'
            java:
              - *shared
              - 'services/rx-gateway/**'
              - 'services/interaction-engine/**'
            dotnet:
              - *shared
              - 'services/pharmacy-system/**'
            python:
              - *shared
              - 'services/phi-shield/**'
            cpp:
              - *shared
              - 'services/interaction-engine/**'
            web:
              - *shared
              - 'web/**'
              - 'services/interaction-engine/**'

  java:
    name: java (rx-gateway)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/rx-gateway } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/rx-gateway/pom.xml
      - name: Build, lint (Spotless), test
        run: ./mvnw -B -ntp verify
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-java
          path: services/rx-gateway/target/surefire-reports/*.xml
          if-no-files-found: ignore

  dotnet:
    name: dotnet (pharmacy-system)
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/pharmacy-system } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('services/pharmacy-system/**/*.csproj', 'services/pharmacy-system/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore PharmacySystem.slnx
      - name: Build (warnings as errors)
        run: dotnet build PharmacySystem.slnx --no-restore -c Release
      - name: Lint (dotnet format)
        run: dotnet format PharmacySystem.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test PharmacySystem.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-dotnet
          path: services/pharmacy-system/TestResults/*.trx
          if-no-files-found: ignore

  python:
    name: python (phi-shield)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/phi-shield } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/phi-shield/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (coverage gate 85%)
        run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-python
          path: services/phi-shield/reports/junit.xml
          if-no-files-found: ignore

  cpp:
    name: cpp (interaction-engine)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/interaction-engine } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-18 clang-format-18
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/interaction-engine/build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('services/interaction-engine/CMakeLists.txt') }}
      - name: Lint (clang-format + headers)
        run: CLANG_FORMAT=clang-format-18 ./check-format.sh
      - name: Build with ASan + UBSan
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 -DRXG_SANITIZE=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit junit.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-cpp
          path: services/interaction-engine/build/junit.xml
          if-no-files-found: ignore

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + Prettier + headers)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-web
          path: web/reports/junit.xml
          if-no-files-found: ignore

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.3
      - name: Validate REQUIREMENTS.yml and test tags
        run: python tools/traceability/validate_requirements.py

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, java, dotnet, python, cpp, web, requirements]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled (skipped is fine)
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json, sys
          bad = {k: v['result'] for k, v in json.load(sys.stdin).items() if v['result'] in ('failure', 'cancelled')}
          print(bad or 'all jobs passed or were skipped')
          sys.exit(1 if bad else 0)"
