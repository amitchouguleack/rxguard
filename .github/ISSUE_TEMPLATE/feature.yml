name: Feature
description: A new capability or improvement.
labels: [feature]
body:
  - type: textarea
    id: what
    attributes:
      label: What
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The clinical, security, or engineering reason.
    validations: { required: true }
  - type: input
    id: requirements
    attributes:
      label: Requirements
      placeholder: REQ-... (new or existing IDs in docs/regulatory/REQUIREMENTS.yml)
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations: { required: true }
