# Start only what you need on the 2-core Codespace, for example:
#   docker compose --profile phi up
#   docker compose --profile full up
# Profiles: db, gateway, pharmacy, phi, fhir-server, observability, full

name: rxguard

services:
  db:
    image: postgres:17-alpine
    profiles: [db, gateway, pharmacy, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rxguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rxguard-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-rxguard}
      GATEWAY_OWNER_PASSWORD: ${GATEWAY_OWNER_PASSWORD:-gateway-owner-local-dev}
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:-gateway-app-local-dev}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./deploy/db/init.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rx-gateway:
    build:
      context: ./services/rx-gateway
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    profiles: [gateway, full]
    ports: ["8080:8080"]
    # Same limit as the Render free plan, so memory problems show up locally first.
    mem_limit: 512m
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rxguard}
      DB_APP_USER: gateway_app
      DB_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:-gateway-app-local-dev}
      DB_MIGRATION_USER: gateway_owner
      DB_MIGRATION_PASSWORD: ${GATEWAY_OWNER_PASSWORD:-gateway-owner-local-dev}
      RXGUARD_CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }

  pharmacy-system:
    build: ./services/pharmacy-system
    profiles: [pharmacy, full]
    ports: ["8081:8081"]
    depends_on:
      db: { condition: service_healthy }

  phi-shield:
    build: ./services/phi-shield
    profiles: [phi, full]
    ports: ["8000:8000"]

  fhir-server:
    image: hapiproject/hapi:v8.12.0-1
    profiles: [fhir-server]
    ports: ["8090:8080"]

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    ports: ["9090:9090"]
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    ports: ["3000:3000"]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [observability]
    ports: ["16686:16686", "4317:4317", "4318:4318"]

volumes:
  pgdata:
